[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chronos-agent-runtime"
version = "0.5.0"
description = "Local SQLite policies, execution traces and explicit continuations for AI agents"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [
    { name = "FJSolution" }
]
keywords = ["ai-agents", "time-travel-debugging", "llm-firewall", "deterministic-replay", "mcp", "observability"]
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "pydantic>=2.0.0",
    "httpx>=0.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "httpx>=0.24.0",
]

browser-tests = ["playwright>=1.40.0"]

[tool.setuptools.packages.find]
include = ["chronos*"]
